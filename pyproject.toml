[project]
name = "gsc-mcp-server"
version = "0.1.0"
description = "Read-only Model Context Protocol server for Google Search Console."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ricardo Arrigoni" }]
keywords = ["mcp", "google-search-console", "seo", "search-analytics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "mcp>=2.0.0",
  "httpx>=0.27",
  "google-auth>=2.35",
  "google-auth-oauthlib>=1.2",
  "pydantic>=2.9",
  "keyring>=25.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.7",
  "pip-audit>=2.7",
  "pre-commit>=4.0",
]

[project.scripts]
gsc-mcp-server = "gsc_mcp_server.cli:main"

[project.urls]
Homepage = "https://github.com/ricoarrigoni/gsc-mcp-server"
Issues = "https://github.com/ricoarrigoni/gsc-mcp-server/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsc_mcp_server"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
